# Render Blueprint configuration for monorepo using Docker
services:
  - type: web
    name: aaan-website
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: MONGODB_URI
        sync: false   # Set this secret in Render Dashboard
      - key: JWT_SECRET
        sync: false   # Set this secret in Render Dashboard
      - key: CLIENT_URL
        value: "https://aaan-website.onrender.com"
      - key: RAZORPAY_KEY_ID
        sync: false   # Set this secret in Render Dashboard
      - key: RAZORPAY_KEY_SECRET
        sync: false   # Set this secret in Render Dashboard
